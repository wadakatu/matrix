name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5 # Node at the version pinned in mise.toml
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run build
      - run: npm run check
  specimens:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:specimens
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: specimens-report
          path: test-results/
          retention-days: 7
      # Chromium's PDF of Article C, read by hand once per release candidate (05, "The manual rows").
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: article-c-pdf
          path: test-results/1.0/article-c.pdf
          retention-days: 30
  engines:
    # The verification matrix in Playwright's Firefox and WebKit builds (05, "Where each row runs").
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run build
      - run: npm run test:engines
      # A still of each specimen at 1440 and 390 from both engines, looked at and not compared.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engine-stills
          path: test-results/engines/
          retention-days: 30
  stories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:stories
      - run: npm run build-storybook
      # Reviewed from the artefact until the DNS gate is cleared (06); there is no deployment.
      - uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diff
          path: |
            playwright-report/
            test-results/
          retention-days: 7

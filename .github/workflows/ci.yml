name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5 # Node at the version pinned in mise.toml
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run build
      - run: npm run check
  specimens:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:specimens
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: specimens-report
          path: test-results/
          retention-days: 7
